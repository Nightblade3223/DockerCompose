version: "3.9"

services:
  ###########################################################################
  # ───────────── PERSONAL GAME LIBRARY ─────────────
  ###########################################################################
  lancommander:
    image: lancommander/lancommander:latest
    container_name: lancommander
    hostname: lancommander
    volumes:
      - ${NASDRIVE_2:?Set NASDRIVE_2 in .env}Games/LANCommander:/app/Data
    ports:
      - "1337:1337/tcp"
      - "35891:35891/udp"
      - "213:213/udp"
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}

  ###########################################################################
  # ───────────── INDEXERS ─────────────
  ###########################################################################
  prowlarr:
    image: linuxserver/prowlarr:latest
    container_name: prowlarr
    hostname: prowlarr
    volumes:
      - ${ARRPATH}Prowlarr/config:/config
      - ${ARRPATH}Prowlarr/backup:/data/Backup
      - ${CACHE}Downloads:/downloads
    ports:
      - "9696:9696"
    restart: unless-stopped
    env_file:
      - ".env"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK_SET=002
      - TZ=${TZ}

  ###########################################################################
  # ───────────── TV AUTOMATION ─────────────
  ###########################################################################
  sonarr:
    image: linuxserver/sonarr:latest
    container_name: sonarr
    hostname: sonarr
    volumes:
      - ${ARRPATH}Sonarr/config:/config
      - ${ARRPATH}Sonarr/backup:/data/Backup
      - ${NASDRIVE_1}Sonarr/tvshows:/data/nas_tvshows
      - ${NASDRIVE_1}Anime:/data/nas_anime
      - ${CACHE}Downloads:/downloads
    ports:
      - "8989:8989"
    restart: unless-stopped
    env_file:
      - ".env"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK_SET=002
      - TZ=${TZ}

  ###########################################################################
  # ───────────── MOVIE AUTOMATION ─────────────
  ###########################################################################
  radarr:
    image: linuxserver/radarr:latest
    container_name: radarr
    hostname: radarr
    volumes:
      - ${ARRPATH}Radarr/config:/config
      - ${ARRPATH}Radarr/backup:/data/Backup
      - ${NASDRIVE_1}Radarr/movies:/data/nas_movies
      - ${CACHE}Downloads:/downloads
    ports:
      - "7878:7878"
    restart: unless-stopped
    env_file:
      - ".env"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK_SET=002
      - TZ=${TZ}

  ###########################################################################
  # ───────────── MUSIC AUTOMATION ─────────────
  ###########################################################################
  # ───────────── HOMEPAGE / DASHBOARD ─────────────
  ###########################################################################
  # ───────────── MEDIA SERVER ─────────────
  ###########################################################################
  jellyfin:
    image: linuxserver/jellyfin:latest
    container_name: jellyfin
    hostname: jellyfin
    ports:
      - "8096:8096/tcp"
      - "7359:7359/udp"
      - "1900:1900/udp"
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    volumes:
      - ${ARRPATH}Jellyfin/config:/config
      - ${NASDRIVE_1}Radarr/movies:/data/nas_Movies
      - ${NASDRIVE_1}Sonarr/tvshows:/data/nas_TVShows
      - ${NASDRIVE_1}Anime:/data/nas_Anime
    restart: unless-stopped
    env_file:
      - ".env"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK_SET=002
      - TZ=${TZ}

  ###########################################################################
  # ───────────── REQUEST MANAGEMENT ─────────────
  ###########################################################################
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    ports:
      - "5055:5055"
    volumes:
      - ${ARRPATH}Jellyseerr/config:/app/config
    restart: unless-stopped
    env_file:
      - ".env"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK_SET=002
      - TZ=${TZ}

  ###########################################################################
  # ───────────── TORRENT CLIENT ─────────────
  ###########################################################################
  qbittorrent:
    image: linuxserver/qbittorrent:latest
    container_name: qbittorrent
    hostname: qbittorrent
    volumes:
      - ${ARRPATH}qbittorrent/config:/config
      - ${CACHE}Downloads:/downloads
    ports:
      - "8080:8080"
      - "6881:6881"
      - "6881:6881/udp"
    environment:
      - WEBUI_PORT=8080
      - TORRENTING_PORT=6881
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK_SET=002
      - TZ=${TZ}
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    restart: unless-stopped
    env_file:
      - ".env"

  ###########################################################################
  # ───────────── TRANSCODE SERVER ─────────────
  ###########################################################################
  # ───────────── TRANSCODE WORKER NODE ─────────────
  ###########################################################################
  # ───────────── REVERSE PROXY ─────────────
  ###########################################################################
  npmplus:
    image: docker.io/zoeyvid/npmplus:latest
    container_name: npmplus
    hostname: npmplus
    ports:
      - "80:80"
      - "81:81"
      - "443:443/tcp"
      - "443:443/udp"
    volumes:
      - ${ARRPATH}NPMPlus/data:/data
    restart: unless-stopped
    env_file:
      - ".env"
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - NGINX_WORKER_PROCESSES=auto

  ###########################################################################
  # ───────────── PROXY THROUGH CLOUDFLARE ─────────────
  ###########################################################################
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    ports:
      - "${PORT:-8191}:8191"
    restart: unless-stopped
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_HTML=${LOG_HTML:-false}
      - CAPTCHA_SOLVER=${CAPTCHA_SOLVER:-none}
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK_SET=002

  ###########################################################################
  # ───────────── BYPARR ─────────────
  ###########################################################################

  byparr:
    image: ghcr.io/thephaseless/byparr:latest
    container_name: byparr
    ports:
      - "8192:8191"
    restart: unless-stopped
    env_file:
      - ".env"
    environment:
      - TZ=${TZ}

  ###########################################################################
  # ───────────── INVITE SYSTEM ─────────────
