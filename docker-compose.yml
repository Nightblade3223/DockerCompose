version: "3.9"

services:
  karaoke-eternal:
    image: radrootllc/karaoke-eternal:latest
    container_name: karaoke-eternal
    volumes:
      - ${NASDRIVE_2:?Set NASDRIVE_2 in .env}Music/KaraokeEternal/config:/config
      - ${NASDRIVE_2:?Set NASDRIVE_2 in .env}Music/Library:/mnt/karaoke
    ports:
      - "8082:8080"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    restart: unless-stopped

  massivedecks-init:
    image: ghcr.io/lattyware/massivedecks/server:latest-release
    user: "0:0"
    command: ["node", "/init.cjs"]
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      - ./config/massivedecks/init.cjs:/init.cjs:ro
      - ${NASDRIVE_2:?Set NASDRIVE_2 in .env}Games/MassiveDecks/config:/config
    networks:
      - massivedecks
    restart: "no"

  massivedecks-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: massivedecks
      POSTGRES_DB: massivedecks
      POSTGRES_PASSWORD_FILE: /run/massivedecks/postgres-password
    volumes:
      - ${NASDRIVE_2:?Set NASDRIVE_2 in .env}Games/MassiveDecks/postgres:/var/lib/postgresql/data
      - ${NASDRIVE_2:?Set NASDRIVE_2 in .env}Games/MassiveDecks/config:/run/massivedecks:ro
    depends_on:
      massivedecks-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U massivedecks -d massivedecks"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - massivedecks
    restart: unless-stopped

  massivedecks-server:
    image: ghcr.io/lattyware/massivedecks/server:latest-release
    user: "${PUID}:${PGID}"
    environment:
      NODE_ENV: production
      MD_CONFIG_PATH: /config/config.json5
    volumes:
      - ${NASDRIVE_2:?Set NASDRIVE_2 in .env}Games/MassiveDecks/config:/config:ro
    depends_on:
      massivedecks-db:
        condition: service_healthy
    networks:
      massivedecks:
        aliases:
          - server
    restart: unless-stopped

  massivedecks:
    image: ghcr.io/lattyware/massivedecks/client:latest-release
    container_name: massivedecks
    ports:
      - "8083:8080"
    depends_on:
      - massivedecks-server
    networks:
      - default
      - massivedecks
    restart: unless-stopped

  ###########################################################################
  # ───────────── PERSONAL GAME LIBRARY ─────────────
  ###########################################################################
  lancommander:
    image: lancommander/lancommander:latest
    container_name: lancommander
    hostname: lancommander
    volumes:
      - ${NASDRIVE_2:?Set NASDRIVE_2 in .env}Games/LANCommander:/app/Data
    ports:
      - "1337:1337/tcp"
      - "35891:35891/udp"
      - "213:213/udp"
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}

  ###########################################################################
  # ───────────── INDEXERS ─────────────
  ###########################################################################
  prowlarr:
    image: linuxserver/prowlarr:latest
    container_name: prowlarr
    hostname: prowlarr
    volumes:
      - ${ARRPATH}Prowlarr/config:/config
      - ${ARRPATH}Prowlarr/backup:/data/Backup
      - ${CACHE}Downloads:/downloads
    ports:
      - "9696:9696"
    restart: unless-stopped
    env_file:
      - ".env"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK_SET=002
      - TZ=${TZ}

  ###########################################################################
  # ───────────── TV AUTOMATION ─────────────
  ###########################################################################
  sonarr:
    image: linuxserver/sonarr:latest
    container_name: sonarr
    hostname: sonarr
    volumes:
      - ${ARRPATH}Sonarr/config:/config
      - ${ARRPATH}Sonarr/backup:/data/Backup
      - ${NASDRIVE_1}Sonarr/tvshows:/data/nas_tvshows
      - ${NASDRIVE_1}Anime:/data/nas_anime
      - ${CACHE}Downloads:/downloads
    ports:
      - "8989:8989"
    restart: unless-stopped
    env_file:
      - ".env"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK_SET=002
      - TZ=${TZ}

  ###########################################################################
  # ───────────── MOVIE AUTOMATION ─────────────
  ###########################################################################
  radarr:
    image: linuxserver/radarr:latest
    container_name: radarr
    hostname: radarr
    volumes:
      - ${ARRPATH}Radarr/config:/config
      - ${ARRPATH}Radarr/backup:/data/Backup
      - ${NASDRIVE_1}Radarr/movies:/data/nas_movies
      - ${CACHE}Downloads:/downloads
    ports:
      - "7878:7878"
    restart: unless-stopped
    env_file:
      - ".env"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK_SET=002
      - TZ=${TZ}

  ###########################################################################
  # ───────────── MUSIC AUTOMATION ─────────────
  ###########################################################################
  lidarr:
    image: linuxserver/lidarr:latest
    container_name: lidarr
    hostname: lidarr
    volumes:
      - ${ARRPATH}Lidarr/config:/config
      - ${NASDRIVE_2:?Set NASDRIVE_2 in .env}Music/Library:/data/nas_music
      - ${CACHE}Downloads:/downloads
    ports:
      - "8686:8686"
    restart: unless-stopped
    env_file:
      - ".env"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK_SET=002
      - TZ=${TZ}

  ###########################################################################
  # ───────────── HOMEPAGE / DASHBOARD ─────────────
  ###########################################################################
  # ───────────── MEDIA SERVER ─────────────
  ###########################################################################
  jellyfin:
    image: linuxserver/jellyfin:latest
    container_name: jellyfin
    hostname: jellyfin
    ports:
      - "8096:8096/tcp"
      - "7359:7359/udp"
      - "1900:1900/udp"
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    volumes:
      - ${ARRPATH}Jellyfin/config:/config
      - ${NASDRIVE_1}Radarr/movies:/data/nas_Movies
      - ${NASDRIVE_1}Sonarr/tvshows:/data/nas_TVShows
      - ${NASDRIVE_1}Anime:/data/nas_Anime
    restart: unless-stopped
    env_file:
      - ".env"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK_SET=002
      - TZ=${TZ}

  ###########################################################################
  # ───────────── REQUEST MANAGEMENT ─────────────
  ###########################################################################
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    ports:
      - "5055:5055"
    volumes:
      - ${ARRPATH}Jellyseerr/config:/app/config
    restart: unless-stopped
    env_file:
      - ".env"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK_SET=002
      - TZ=${TZ}

  ###########################################################################
  # ───────────── TORRENT CLIENT ─────────────
  ###########################################################################
  qbittorrent:
    image: linuxserver/qbittorrent:latest
    container_name: qbittorrent
    hostname: qbittorrent
    volumes:
      - ${ARRPATH}qbittorrent/config:/config
      - ${CACHE}Downloads:/downloads
    ports:
      - "8080:8080"
      - "6881:6881"
      - "6881:6881/udp"
    environment:
      - WEBUI_PORT=8080
      - TORRENTING_PORT=6881
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK_SET=002
      - TZ=${TZ}
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    restart: unless-stopped
    env_file:
      - ".env"

  ###########################################################################
  # ───────────── TRANSCODE SERVER ─────────────
  ###########################################################################
  # ───────────── TRANSCODE WORKER NODE ─────────────
  ###########################################################################
  # ───────────── REVERSE PROXY ─────────────
  ###########################################################################
  npmplus:
    image: docker.io/zoeyvid/npmplus:latest
    container_name: npmplus
    hostname: npmplus
    ports:
      - "80:80"
      - "81:81"
      - "443:443/tcp"
      - "443:443/udp"
    volumes:
      - ${ARRPATH}NPMPlus/data:/data
    restart: unless-stopped
    env_file:
      - ".env"
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - NGINX_WORKER_PROCESSES=auto

  ###########################################################################
  # ───────────── PROXY THROUGH CLOUDFLARE ─────────────
  ###########################################################################
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    ports:
      - "${PORT:-8191}:8191"
    restart: unless-stopped
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_HTML=${LOG_HTML:-false}
      - CAPTCHA_SOLVER=${CAPTCHA_SOLVER:-none}
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK_SET=002

  ###########################################################################
  # ───────────── BYPARR ─────────────
  ###########################################################################

  byparr:
    image: ghcr.io/thephaseless/byparr:latest
    container_name: byparr
    ports:
      - "8192:8191"
    restart: unless-stopped
    env_file:
      - ".env"
    environment:
      - TZ=${TZ}

  ###########################################################################
  # ───────────── END OF SERVICES ─────────────

networks:
  massivedecks:
